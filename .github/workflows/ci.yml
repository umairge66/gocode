name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The runner's default temp folder is spelled with an 8.3 short name
      # (C:\Users\RUNNER~1\...), which the permission checks refuse as a
      # suspicious spelling; tests use a long-name folder instead.
      - name: Long-name temp folder
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test-output.txt

      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          # One annotation lists every failing test; then one annotation per
          # failing test, package panic, data race or build failure carries
          # its whole output block (GitHub shows at most 10 error annotations
          # per step). The job summary gets the complete output of each.
          if [ -f test-output.txt ]; then
            go run ./cmd/ci-testreport -max 9 -title "Test failure (${{ matrix.os }})" test-output.txt
          fi

  linux-checks:
    name: linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module checksums
        run: go mod verify

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd extension)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check extension script syntax
        run: node --check extension/background.js

      - name: Vet on 32-bit (linux/386)
        run: GOARCH=386 go vet ./...

      - name: Race tests
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee race-output.txt

      - name: Report race test failures
        if: failure()
        run: |
          # Same reporting as the test job: a list of every failure, one
          # annotation per failure with its output, the rest in the summary.
          if [ -f race-output.txt ]; then
            go run ./cmd/ci-testreport -max 9 -title "Race test failure" race-output.txt
          fi

      - name: THIRD_PARTY_NOTICES up to date
        run: |
          python3 scripts/gen-notices.py
          git diff --exit-code THIRD_PARTY_NOTICES

      - name: Cross-compile every release target
        run: |
          set -eu
          for t in linux/amd64 linux/arm64 linux/386 linux/arm linux/riscv64 linux/ppc64le linux/s390x \
                   darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 windows/386 \
                   freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64; do
            echo "::group::$t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} GOARM=7 go build -trimpath -o /dev/null ./cmd/gocode
            echo "::endgroup::"
          done
