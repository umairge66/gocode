name: Release

# A pushed tag vX.Y.Z (or vX.Y.Z-suffix) builds every platform, packages the
# archives, AppImages, .deb/.rpm packages and the Chrome extension, signs
# checksums.txt when the signing key secret is configured, and publishes a
# GitHub release. Running the workflow by hand ("Run workflow") is a dry run:
# it builds and uploads everything as workflow artifacts but creates no
# release. See RELEASING.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the dry run (semver, without the leading v)"
        required: true
        default: "0.0.0-dryrun"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = push ]; then
            v=${REF_NAME#v}
          else
            v=${INPUT_VERSION#v}
          fi
          if ! printf '%s\n' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$v' is not a semantic version (want e.g. 1.2.3 or 1.3.0-rc.1)"
            exit 1
          fi
          core=${v%%+*}
          case $core in
            *-*) pre=true ;;
            *) pre=false ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "Version $v (prerelease: $pre)"
          # A release needs its CHANGELOG.md section; check it before the
          # long build. A dry run only warns.
          if ! sh scripts/release-notes.sh "$v" > /dev/null 2> notes.err; then
            if [ "$EVENT_NAME" = push ]; then
              echo "::error file=CHANGELOG.md::$(cat notes.err). Add the section, commit it, and tag that commit."
              exit 1
            fi
            echo "::warning file=CHANGELOG.md::$(cat notes.err)"
          fi

  build:
    name: build (${{ matrix.group }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - group: linux
            targets: "linux/amd64 linux/arm64 linux/386 linux/armv7 linux/riscv64 linux/ppc64le linux/s390x"
          - group: darwin-windows
            targets: "darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 windows/386"
          - group: bsd
            targets: "freebsd/amd64 freebsd/arm64 openbsd/amd64 netbsd/amd64"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TARGETS: ${{ matrix.targets }}
          RELEASE_PUBLIC_KEYS: ${{ vars.GOCODE_RELEASE_PUBLIC_KEY }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          go mod download
          sh scripts/build-release.sh --targets "$TARGETS" --no-extension --no-checksums "$VERSION" dist

      - name: Check the injected version
        if: matrix.group == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          out=$(dist/bin/linux-amd64/gocode --version)
          echo "$out"
          case $out in
            "$VERSION "*) ;;
            *) echo "::error::gocode --version printed '$out', expected $VERSION"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.group }}
          path: dist/assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.group == 'linux'
        with:
          name: linux-bin
          path: |
            dist/bin/linux-amd64/
            dist/bin/linux-arm64/
          if-no-files-found: error
          retention-days: 7

  linux-packages:
    name: AppImage, deb, rpm, extension
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPIMAGETOOL_VERSION: "1.9.1"
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
      APPIMAGE_RUNTIME_VERSION: "20251108"
      APPIMAGE_RUNTIME_X86_64_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
      APPIMAGE_RUNTIME_AARCH64_SHA256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
      NFPM_VERSION: "2.48.0"
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-bin
          path: dist/bin

      - name: Fetch pinned packaging tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          fetch() { # url file sha256
            curl -fsSL --retry 3 --proto '=https' -o "$2" "$1"
            echo "$3  $2" | sha256sum -c -
          }
          fetch "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage" \
            appimagetool "$APPIMAGETOOL_SHA256"
          fetch "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-x86_64" \
            runtime-x86_64 "$APPIMAGE_RUNTIME_X86_64_SHA256"
          fetch "https://github.com/AppImage/type2-runtime/releases/download/$APPIMAGE_RUNTIME_VERSION/runtime-aarch64" \
            runtime-aarch64 "$APPIMAGE_RUNTIME_AARCH64_SHA256"
          fetch "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            nfpm.tar.gz "$NFPM_SHA256"
          tar -xzf nfpm.tar.gz nfpm
          chmod +x appimagetool nfpm
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Build AppImages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          tools=$RUNNER_TEMP/tools
          APPIMAGETOOL=$tools/appimagetool APPIMAGE_RUNTIME=$tools/runtime-x86_64 \
            sh scripts/package-appimage.sh "$VERSION" x86_64 dist/bin/linux-amd64/gocode dist/packages
          APPIMAGETOOL=$tools/appimagetool APPIMAGE_RUNTIME=$tools/runtime-aarch64 \
            sh scripts/package-appimage.sh "$VERSION" aarch64 dist/bin/linux-arm64/gocode dist/packages

      - name: Smoke-test the x86_64 AppImage
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eu
          out=$("dist/packages/gocode-$VERSION-x86_64.AppImage" --version)
          echo "$out"
          case $out in
            "$VERSION "*) ;;
            *) echo "::error::AppImage printed '$out'"; exit 1 ;;
          esac

      - name: Build .deb and .rpm packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          for arch in amd64 arm64; do
            for fmt in deb rpm; do
              NFPM_ARCH=$arch NFPM_VERSION=$VERSION NFPM_BINARY=dist/bin/linux-$arch/gocode \
              NFPM_HOMEPAGE="https://github.com/$REPO" \
                nfpm package --config packaging/linux/nfpm.yaml --packager "$fmt" --target dist/packages/
            done
          done
          ls -l dist/packages

      - name: Smoke-test the amd64 .deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          deb=$(ls dist/packages/gocode_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          out=$(/usr/bin/gocode --version)
          echo "$out"
          case $out in
            "$VERSION "*) ;;
            *) echo "::error::installed gocode printed '$out'"; exit 1 ;;
          esac
          sudo dpkg -r gocode

      - name: Package the Chrome extension
        run: sh scripts/package-extension.sh dist/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-linux-packages
          path: dist/packages/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  finalize:
    name: checksums and signature
    needs: [version, build, linux-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: dist/assets
          merge-multiple: true

      - name: Check the asset set
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          cd dist/assets
          missing=0
          for t in linux_amd64 linux_arm64 linux_386 linux_arm linux_riscv64 linux_ppc64le linux_s390x \
                   darwin_amd64 darwin_arm64 freebsd_amd64 freebsd_arm64 openbsd_amd64 netbsd_amd64; do
            [ -f "gocode_$t.tar.gz" ] || { echo "::error::missing gocode_$t.tar.gz"; missing=1; }
          done
          for t in windows_amd64 windows_arm64 windows_386; do
            [ -f "gocode_$t.zip" ] || { echo "::error::missing gocode_$t.zip"; missing=1; }
          done
          for f in "gocode-$VERSION-x86_64.AppImage" "gocode-$VERSION-aarch64.AppImage"; do
            [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          ls gocode_*.deb gocode-*.rpm gocode-chrome-extension-*.zip >/dev/null || missing=1
          exit "$missing"

      - name: Write checksums.txt
        run: sh scripts/build-release.sh --checksums dist/assets

      - name: Sign checksums.txt
        id: sign
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNING_KEY: ${{ secrets.GOCODE_RELEASE_SIGNING_KEY }}
          PUBLIC_KEY: ${{ vars.GOCODE_RELEASE_PUBLIC_KEY }}
        run: |
          set -eu
          if [ -z "$SIGNING_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GOCODE_RELEASE_SIGNING_KEY is not set: the release is published without checksums.txt.sig, and 'gocode update' will refuse it."
            exit 0
          fi
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::GOCODE_RELEASE_SIGNING_KEY is set but the GOCODE_RELEASE_PUBLIC_KEY variable is not, so the binaries could not verify this signature."
            exit 1
          fi
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          chmod 600 "$keyfile"
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          go run ./cmd/gocode-release sign -key "$keyfile" -version "$VERSION" dist/assets/checksums.txt
          rm -f "$keyfile"
          go run ./cmd/gocode-release verify -pubkey "$PUBLIC_KEY" dist/assets/checksums.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          {
            echo "### Release assets"
            echo
            echo "Signed: $SIGNED"
            echo
            echo '```'
            ls -l dist/assets
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  attest:
    name: build attestation
    needs: finalize
    if: github.event_name == 'push' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/assets

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/assets/checksums.txt

  publish:
    name: publish GitHub release
    needs: [version, finalize]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The checkout comes first: it empties a workspace that is not yet a
      # git checkout, which would delete the downloaded assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts/release-notes.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SIGNED: ${{ needs.finalize.outputs.signed }}
        run: |
          set -eu
          notes=$RUNNER_TEMP/notes.md
          title="gocode $VERSION"
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main"
          {
            sh scripts/release-notes.sh "$VERSION"
            echo
            echo "### Install or update"
            echo
            echo "- Already installed: \`gocode update\`"
            echo "- macOS, Linux, BSD: \`curl -fsSL $raw/install.sh | sh\`"
            echo "- Windows (PowerShell): \`irm $raw/install.ps1 | iex\`"
            echo "- Homebrew: \`brew upgrade gocode\` (new install: \`brew install umairge66/gocode/gocode\`); the formula is updated shortly after each release"
            echo "- Or download the archive for your platform below."
            echo
          } > "$notes"
          if [ "$SIGNED" = true ]; then
            {
              echo "Every asset is listed in \`checksums.txt\`, which is signed (\`checksums.txt.sig\`, minisign format). \`gocode update\` verifies both before installing."
              echo
            } >> "$notes"
          else
            title="$title (unsigned)"
            unsigned=$(cat "$notes")
            {
              echo "> [!WARNING]"
              echo "> This release is **not signed**: there is no \`checksums.txt.sig\`, so \`gocode update\` will refuse to install it."
              echo "> Download the archive for your platform by hand and check it against \`checksums.txt\`."
              echo
              printf '%s\n' "$unsigned"
            } > "$notes"
          fi
          set -- --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --notes-file "$notes" --generate-notes
          if [ "$PRERELEASE" = true ]; then
            set -- "$@" --prerelease
          fi
          gh release create "$TAG" "$@" dist/assets/*
